<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>미진이 요리 도우미</title>
<script>
/* 앱 안 브라우저(카카오톡·네이버 등)에서 열리면 크롬으로 다시 연다 */
(function(){
  try{
    var ua=navigator.userAgent.toLowerCase();
    var inApp=/kakaotalk|naver\(inapp|instagram|fban|fbav|fbios|daumapps|\bline\//.test(ua);
    if(!inApp)return;
    if(location.search.indexOf('nochrome=1')>-1)return;
    var url=location.href.split('#')[0];
    if(ua.indexOf('android')>-1){
      var back=url+(url.indexOf('?')>-1?'&':'?')+'nochrome=1';
      location.href='intent://'+url.replace(/^https?:\/\//,'')+
        '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url='+encodeURIComponent(back)+';end';
    }else if(ua.indexOf('iphone')>-1||ua.indexOf('ipad')>-1){
      location.href=url.replace(/^https:\/\//,'googlechromes://').replace(/^http:\/\//,'googlechrome://');
      setTimeout(function(){
        if(!document.hidden)alert('크롬이 없으면 사파리 주소창에\n'+url+'\n을 직접 입력하세요.');
      },1500);
    }
  }catch(e){}
})();
</script>
<meta name="description" content="미진이 요리 도우미 - 집에 있는 재료와 오늘 상황을 고르면 모바일에서 쉽게 요리를 추천하고 자세한 조리법을 알려드립니다.">
<meta name="theme-color" content="#b85a34">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="미진이 요리 도우미">
<meta property="og:type" content="website">
<meta property="og:title" content="미진이 요리 도우미">
<meta property="og:description" content="냉장고 재료와 오늘 상황에 맞춰 맛있게 만들 수 있도록 자상하게 알려주는 모바일 요리 도우미">
<meta property="og:image" content="https://jeon-seungdae.github.io/home/mijin.png">
<meta property="og:url" content="https://jeon-seungdae.github.io/home/">
<meta property="og:site_name" content="미진이 요리 도우미">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="shortcut icon" href="icon-192.png">
<style>
:root{
  --bg:#fbf6f1;--card:#fff;--ink:#2b2622;--sub:#6a5f57;--line:#e6d9cd;
  --accent:#b85a34;--accent-soft:#f6e4d9;--ok:#2f6b4f;--warn:#a93a26;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:21px/1.65 "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px)}
main{max-width:640px;margin:0 auto;padding:16px 16px calc(120px + env(safe-area-inset-bottom,0px))}
.top h1{font-size:28px;line-height:1.3;margin:4px 0 2px}
.top .sub{margin:0 0 14px;color:var(--sub)}

/* 진행 표시 */
.bar{display:flex;gap:6px}
.bar i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.bar i.on{background:var(--accent)}
.plabel{margin:8px 0 14px;font-weight:700;color:var(--accent)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px;margin-bottom:14px}
.panel h2{font-size:25px;line-height:1.35;margin:0 0 4px;outline:none}
.panel .desc{margin:0 0 14px;color:var(--sub)}
.blk{margin-top:18px}
.lab{font-weight:700;margin-bottom:8px}
.note-s{color:var(--sub);font-size:19px;margin:8px 0 0}

/* 선택 버튼(칩) */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{font:inherit;min-height:54px;padding:8px 18px;border-radius:14px;border:2px solid var(--line);
  background:#fff;color:var(--ink);cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.chip:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #e0a487;outline-offset:2px}

label{display:block;font-weight:700;margin:14px 0 6px}
textarea,input[type=text],input[type=password]{width:100%;font:inherit;padding:12px 13px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
textarea{min-height:120px;resize:vertical}

details.voice{margin-top:20px;border:2px dashed var(--line);border-radius:14px;padding:10px 14px}
details.voice summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
details.voice p{margin:6px 0;color:var(--sub);font-size:19px}
.msg{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--accent-soft)}
.msg.err{background:#f8e7e3;color:var(--warn)}

.btn{font:inherit;font-weight:700;min-height:58px;padding:10px 20px;border-radius:14px;border:0;cursor:pointer}
.btn.main{background:var(--accent);color:#fff}
.btn.sub{background:var(--accent-soft);color:var(--accent)}
.btn[hidden]{display:none}

/* 아래 고정 버튼 */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:10px;justify-content:center;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));
  background:rgba(251,246,241,.97);border-top:1px solid var(--line)}
.nav .btn{flex:1;max-width:300px}
.nav .btn.sub{flex:.6}

/* 고른 조건 요약 */
dl.sum{margin:0}
dl.sum div{padding:10px 0;border-bottom:1px solid var(--line)}
dl.sum div:last-child{border-bottom:0}
dl.sum dt{font-weight:700;color:var(--accent);font-size:19px}
dl.sum dd{margin:2px 0 0}
dl.sum dd.none{color:var(--sub)}
.todo{margin-top:16px;padding:12px 14px;border-radius:12px;background:var(--accent-soft)}
</style>
</head>
<body>
<main>
  <header class="top">
    <h1>🍳 미진이 요리 도우미</h1>
    <p class="sub">냉장고 재료와 오늘 조건을 고르면 쉬운 요리를 추천해 드립니다.</p>
  </header>

  <div class="bar" id="bar" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  <div class="plabel" id="plabel" aria-live="polite"></div>

  <section class="panel" id="p1" hidden>
    <h2>1. 집에 있는 재료</h2>
    <p class="desc">냉장고에 있는 재료를 적어 주세요. 정확하지 않아도 됩니다.</p>
    <label for="ingredients">재료</label>
    <textarea id="ingredients" placeholder="예: 돼지고기, 감자, 양파, 계란, 두부, 김치"></textarea>
    <label for="leftovers">남은 음식</label>
    <textarea id="leftovers" placeholder="예: 남은 불고기, 밥 한 공기, 데친 시금치"></textarea>

    <details class="voice">
      <summary>🔊 음성 설정 (처음 한 번만)</summary>
      <p>조리법을 읽어 주는 Azure 한국어 여성 음성 <b>선희</b>를 쓰려면 한 번만 입력해 주세요. 키는 이 휴대폰에만 저장됩니다.</p>
      <label for="azKey">Azure Speech Key</label>
      <input id="azKey" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
      <label for="azRegion">Region</label>
      <input id="azRegion" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="예: koreacentral">
      <div style="margin-top:12px"><button type="button" class="btn sub" id="azSave">설정 저장</button></div>
      <div class="msg" id="azMsg" hidden></div>
    </details>
  </section>

  <section class="panel" id="p2" hidden></section>
  <section class="panel" id="p3" hidden></section>
  <section class="panel" id="p4" hidden></section>
  <section class="panel" id="p5" hidden></section>

  <section class="panel" id="res" hidden>
    <h2>고르신 조건</h2>
    <p class="desc">이렇게 저장되었습니다. 이 조건으로 메뉴를 추천합니다.</p>
    <dl class="sum" id="sum"></dl>
    <div class="todo">🚧 추천 메뉴와 조리법은 다음 단계에서 이 자리에 나옵니다.</div>
  </section>
</main>

<nav class="nav" id="nav">
  <button type="button" class="btn sub" id="back">◀ 이전</button>
  <button type="button" class="btn main" id="next">다음 ▶</button>
</nav>

<script>
const $=id=>document.getElementById(id);
const PAGE_VER='app-v1';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={
  get(k){try{return localStorage.getItem(k)||''}catch(e){return ''}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
};

/* 예전 앱이 등록해 둔 서비스워커가 옛 화면을 돌려주는 일을 막는다 */
(async function(){
  try{
    const KEY='clean_'+PAGE_VER;
    if(store.get(KEY)==='1')return;
    let n=0;
    if(navigator.serviceWorker){
      const regs=await navigator.serviceWorker.getRegistrations();
      n=regs.length; await Promise.all(regs.map(r=>r.unregister()));
    }
    if(window.caches){const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k)))}
    store.set(KEY,'1');
    if(n>0)location.reload();
  }catch(e){}
})();

/* ===== 선택 항목 (원래 앱의 항목 그대로) ===== */
const PANELS={
  p2:{title:'2. 오늘 요리 조건',desc:'해당하는 것을 하나씩 눌러 주세요.',blocks:[
    {g:'budget',label:'예산',single:1,def:['상관없음'],items:['상관없음','5천원 이하','1만원 이하','2만원 이하','3만원 이하']},
    {g:'time',label:'조리 시간',single:1,def:['상관없음'],items:['상관없음','10분','20분','30분','여유 있게']},
    {g:'people',label:'인원 수',single:1,def:['2인'],items:['1인','2인','3~4인 가족','5인 이상']},
    {g:'skill',label:'요리 실력',single:1,def:['초보'],items:['초보','보통','익숙함']},
    {g:'difficulty',label:'난이도',single:1,def:['아주 쉬움'],items:['아주 쉬움','쉬움','조금 손이 감']},
    {g:'shopping',label:'장보기',single:1,def:['장 안 보고 만들기'],items:['장 안 보고 만들기','조금만 사기','장봐도 됨']}
  ]},
  p3:{title:'3. 먹고 싶은 요리',desc:'여러 개 골라도 됩니다. 고르지 않으면 알아서 추천합니다.',blocks:[
    {g:'type',label:'국물요리',items:['국','찌개','전골','탕','수프']},
    {g:'type',label:'밥요리',items:['볶음밥','덮밥','비빔밥','죽','주먹밥','김밥']},
    {g:'type',label:'반찬',items:['볶음','조림','무침','부침·전','찜','구이','나물','절임']},
    {g:'type',label:'고기·생선',items:['돼지고기','소고기','닭고기','생선','해산물','두부·콩']},
    {g:'type',label:'면·분식',items:['국수','라면','우동','파스타','떡볶이','만두']},
    {g:'type',label:'간편식',items:['한 그릇 요리','샌드위치','토스트','샐러드','계란요리','전자레인지 요리']},
    {g:'type',label:'특별히 먹고 싶은 것',items:['아이 반찬','손님상','주말 별미','술안주','야식','도시락']}
  ]},
  p4:{title:'4. 맛 · 건강 · 목적',desc:'여러 개 골라도 됩니다.',blocks:[
    {g:'taste',label:'맛 성향',items:['담백','매콤','달콤','짭짤','아이와 함께']},
    {g:'health',label:'건강 고려',def:['일반'],items:['일반','저염','저당','기름 적게','채소 많이']},
    {g:'purpose',label:'목적',items:['평일 한 끼','아침 식사','아이 식사','도시락','주말 별미','손님상','야식','술안주']}
  ]},
  p5:{title:'5. 사용할 수 있는 조리도구',desc:'집에 있는 것을 모두 눌러 주세요.',blocks:[
    {g:'tool',label:'조리도구',def:['가스레인지/인덕션'],items:['가스레인지/인덕션','전자레인지','에어프라이어','오븐','전기밥솥']},
    {g:'weak',label:'특히 어려운 것은?',items:['칼질','불 조절','간 맞추기','고기 익힘','튀김','설거지 많은 요리'],
      note:'선택하면 그 부분을 피하거나 더 자세히 설명하는 방식으로 추천합니다.'}
  ]}
};

function buildPanels(){
  for(const id in PANELS){
    const P=PANELS[id];
    let h=`<h2>${esc(P.title)}</h2><p class="desc">${esc(P.desc)}</p>`;
    for(const b of P.blocks){
      h+=`<div class="blk"><div class="lab">${esc(b.label)}</div>`+
         `<div class="chips" data-group="${b.g}"${b.single?' data-single="1"':''}>`+
         b.items.map(t=>{
           const on=(b.def||[]).includes(t);
           return `<button type="button" class="chip${on?' on':''}" aria-pressed="${on}">${esc(t)}</button>`;
         }).join('')+`</div>`+
         (b.note?`<p class="note-s">${esc(b.note)}</p>`:'')+`</div>`;
    }
    $(id).innerHTML=h;
  }
}

const setChip=(c,on)=>{c.classList.toggle('on',on);c.setAttribute('aria-pressed',on)};
function pick(group){
  return [...document.querySelectorAll(`.chips[data-group="${group}"] .chip.on`)].map(x=>x.textContent.trim());
}
function groups(){
  const s=new Set(); document.querySelectorAll('.chips').forEach(b=>s.add(b.dataset.group)); return [...s];
}

document.addEventListener('click',e=>{
  const c=e.target.closest('.chip'); if(!c)return;
  const box=c.parentElement;
  if(box.dataset.single==='1'){
    box.querySelectorAll('.chip').forEach(x=>setChip(x,false)); setChip(c,true);
  }else setChip(c,!c.classList.contains('on'));
  save();
});
['ingredients','leftovers'].forEach(id=>$(id).addEventListener('input',save));

/* 입력한 내용은 이 휴대폰에 저장해 두었다가 다시 열면 복원 */
function conditions(){
  const o={ingredients:$('ingredients').value.trim(),leftovers:$('leftovers').value.trim()};
  groups().forEach(g=>o[g]=pick(g));
  return o;
}
window.getConditions=conditions;   /* 다음 단계의 추천 로직이 이 값을 사용 */
function save(){
  const o=conditions(); store.set('mijin_cond',JSON.stringify(o));
}
function restore(){
  let o=null; try{o=JSON.parse(store.get('mijin_cond')||'null')}catch(e){}
  if(!o)return;
  $('ingredients').value=o.ingredients||''; $('leftovers').value=o.leftovers||'';
  groups().forEach(g=>{
    if(!Array.isArray(o[g]))return;
    document.querySelectorAll(`.chips[data-group="${g}"] .chip`).forEach(c=>setChip(c,o[g].includes(c.textContent.trim())));
  });
}

/* ===== 화면 이동 (한 화면에 한 가지씩) ===== */
const IDS=['p1','p2','p3','p4','p5','res'];
const NAMES=['재료','오늘 조건','음식 종류','맛·건강·목적','조리도구'];
let cur=0;

function go(n,push){
  cur=n;
  IDS.forEach((id,i)=>$(id).hidden=(i!==n));
  document.querySelectorAll('#bar i').forEach((b,i)=>b.classList.toggle('on',n>=5||i<=n));
  $('plabel').textContent=n<5?`${n+1} / 5 · ${NAMES[n]}`:'고른 조건 확인';
  $('back').hidden=(n===0);
  $('back').textContent=(n===5)?'◀ 조건 고치기':'◀ 이전';
  $('next').textContent=n<4?'다음 ▶':(n===4?'🍚 추천받기':'처음부터 다시');
  if(push)history.pushState({s:n},'');
  window.scrollTo(0,0);
  const h=$(IDS[n]).querySelector('h2');
  if(h){h.tabIndex=-1;try{h.focus({preventScroll:true})}catch(e){}}
}
$('next').onclick=()=>{
  if(cur<4)go(cur+1,true);
  else if(cur===4){renderSummary();go(5,true)}
  else go(0,true);
};
$('back').onclick=()=>history.back();
window.addEventListener('popstate',e=>go(e.state&&typeof e.state.s==='number'?e.state.s:0,false));

/* ===== 고른 조건 요약 ===== */
function renderSummary(){
  const c=conditions();
  const rows=[
    ['재료',c.ingredients],['남은 음식',c.leftovers],
    ['예산',c.budget.join(', ')],['조리 시간',c.time.join(', ')],['인원 수',c.people.join(', ')],
    ['요리 실력',c.skill.join(', ')],['난이도',c.difficulty.join(', ')],['장보기',c.shopping.join(', ')],
    ['음식 종류',c.type.join(', ')],['맛 성향',c.taste.join(', ')],['건강 고려',c.health.join(', ')],
    ['목적',c.purpose.join(', ')],['조리도구',c.tool.join(', ')],['특히 어려운 것',c.weak.join(', ')]
  ];
  $('sum').innerHTML=rows.map(([k,v])=>
    `<div><dt>${esc(k)}</dt><dd class="${v?'':'none'}">${v?esc(v):'선택 안 함'}</dd></div>`).join('');
}

/* ===== 음성 설정 (시험 페이지와 같은 저장 칸을 함께 씀) ===== */
$('azKey').value=store.get('mijin_azure_key');
$('azRegion').value=store.get('mijin_azure_region')||'koreacentral';
$('azSave').onclick=()=>{
  const k=$('azKey').value.trim(), r=$('azRegion').value.trim()||'koreacentral';
  if(k)store.set('mijin_azure_key',k);
  store.set('mijin_azure_region',r);
  const m=$('azMsg'); m.hidden=false; m.className='msg'+(k?'':' err');
  m.textContent=k?'이 휴대폰에 저장했습니다.':'Key를 입력해 주세요.';
};

/* 시작 */
buildPanels();
restore();
history.replaceState({s:0},'');
go(0,false);
</script>
</body>
</html>
