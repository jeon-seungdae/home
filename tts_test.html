<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>선희 음성 속도 테스트</title>
<script>
/* 앱 안 브라우저(카카오톡·네이버 등)에서 열리면 크롬으로 다시 연다.
   자동 이동을 폰이 막는 경우를 위해, 안 넘어가면 위에 「크롬으로 열기」 버튼을 보여 준다. */
(function(){
  try{
    var ua=navigator.userAgent.toLowerCase();
    if(!/kakaotalk|naver\(inapp|instagram|fban|fbav|fbios|daumapps|\bline\//.test(ua))return;
    var isAnd=ua.indexOf('android')>-1, isIos=/iphone|ipad/.test(ua), isKakao=ua.indexOf('kakaotalk')>-1;
    var tried=location.search.indexOf('nochrome=1')>-1;
    var url=location.href.split('#')[0].replace(/[?&]nochrome=1/,'').replace(/\?$/,'');

    function openChrome(){
      if(isAnd){
        var back=url+(url.indexOf('?')>-1?'&':'?')+'nochrome=1';
        location.href='intent://'+url.replace(/^https?:\/\//,'')+
          '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url='+encodeURIComponent(back)+';end';
      }else if(isIos){
        location.href=url.replace(/^https:\/\//,'googlechromes://').replace(/^http:\/\//,'googlechrome://');
      }
    }
    function openKakaoExternal(){location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(url)}

    if(!tried)openChrome();      /* 1) 자동으로 시도 */

    function showBar(){          /* 2) 그래도 이 화면이 남아 있으면 버튼으로 안내 */
      if(document.getElementById('chromeBar'))return;
      var bar=document.createElement('div'); bar.id='chromeBar';
      bar.style.cssText='position:fixed;left:0;right:0;top:0;z-index:99999;background:#fff3cd;color:#3b2f00;padding:12px 14px;font:19px/1.5 sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.3)';
      var msg=document.createElement('div'); msg.style.cssText='font-weight:700;margin-bottom:8px';
      msg.textContent='이 화면에서는 음성과 하이라이트가 잘 안 될 수 있습니다. 크롬으로 열어 주세요.';
      bar.appendChild(msg);
      function mk(label,fn,bg,fg){
        var b=document.createElement('button'); b.type='button'; b.textContent=label;
        b.style.cssText='font:inherit;font-weight:700;min-height:48px;margin:0 8px 8px 0;padding:6px 14px;border:0;border-radius:10px;background:'+bg+';color:'+fg;
        b.onclick=function(){fn(b)}; bar.appendChild(b); return b;
      }
      mk('크롬으로 열기',openChrome,'#b85a34','#fff');
      if(isKakao)mk('기본 브라우저로 열기',openKakaoExternal,'#fff','#3b2f00');
      mk('주소 복사',function(b){
        function done(){b.textContent='복사됨 ✓ 크롬에 붙여넣으세요'}
        function fallback(){
          var t=document.createElement('textarea'); t.value=url; document.body.appendChild(t); t.select();
          try{document.execCommand('copy');done()}catch(e){prompt('주소를 복사해서 크롬에 붙여넣으세요',url)}
          document.body.removeChild(t);
        }
        if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(url).then(done,fallback);
        else fallback();
      },'#fff','#3b2f00');
      mk('닫기',function(){document.body.style.paddingTop='';bar.parentNode.removeChild(bar)},'transparent','#3b2f00');
      document.body.appendChild(bar);
      document.body.style.paddingTop=bar.offsetHeight+'px';
    }
    function start(){setTimeout(function(){if(!document.hidden)showBar()},tried?0:1500)}
    if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();
  }catch(e){}
})();
</script>

<style>
:root{--bg:#f6f7f5;--ink:#1c2626;--sub:#586868;--line:#d7dedb;--accent:#1d6b66;--accent2:#e9f1ef;--warn:#a93a26;--card:#fff}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:21px/1.6 "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:27px;line-height:1.3;margin:6px 0 2px}
p.ver{margin:0 0 6px;color:var(--accent);font-weight:700;font-size:18px}
p.lead{margin:0 0 18px;color:var(--sub)}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
h2{font-size:23px;margin:0 0 10px}
label{display:block;font-weight:700;margin:10px 0 4px}
input,textarea,select{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{min-height:150px;resize:vertical}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:3px solid #7fb8b3;outline-offset:1px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
button{font:inherit;font-weight:700;min-height:56px;padding:10px 18px;border-radius:12px;border:0;cursor:pointer;flex:1 1 150px}
button.main{background:var(--accent);color:#fff}
button.sub{background:var(--accent2);color:var(--accent)}
button.stop{background:#f3e6e2;color:var(--warn)}
.result{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--accent2);min-height:52px}
.result b{font-size:24px}
.err{background:#f8e7e3;color:var(--warn)}
.kara{position:relative;margin-top:12px;padding:14px;border:1px solid var(--line);border-radius:10px;max-height:340px;overflow:auto;background:#fff;line-height:2}
.kara span{padding:3px 4px;border-radius:6px;transition:background .15s}
.kara span.now{background:#ffe27a;font-weight:700}
.kara span.done{color:#8a9797}
.diag{margin-top:12px;font-size:17px;color:var(--sub)}
.diag pre{white-space:pre-wrap;word-break:break-all;margin:8px 0 0;font-size:15px;line-height:1.5}
small{color:var(--sub);font-size:18px}
</style>
</head>
<body>
<main>
  <h1>선희 음성 속도 테스트</h1>
  <p class="ver">버전 8 · 크롬 열기 버튼 + 진단 기록</p>
  <p class="lead">문장 단위로 받아 오는 방식과 예전 방식(전체를 한 번에)의 첫 소리 시간을 비교합니다.</p>

  <section>
    <h2>음성 설정</h2>
    <label for="key">Azure Speech Key</label>
    <input id="key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
    <label for="region">Region</label>
    <input id="region" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="예: koreacentral">
    <div class="row"><button class="sub" id="save">설정 저장</button></div>
    <div class="result" id="saveMsg" hidden></div>
  </section>

  <section>
    <h2>읽을 글</h2>
    <textarea id="text">애호박볶음 조리법입니다. 먼저 애호박을 깨끗이 씻어 0.5센티미터 두께의 반달 모양으로 썹니다. 다진 마늘 0.3큰술과 대파 0.3대를 준비합니다. 팬에 식용유 1큰술을 두르고 중간 불에서 애호박을 2분 볶습니다. 재료의 색과 향이 달라지는 것을 보면서 서두르지 마세요. 처음에는 적힌 시간보다 눈으로 상태를 확인하는 것이 더 중요합니다. 다진 마늘과 대파를 넣고 30초 더 볶습니다. 마지막으로 참기름 0.5작은술을 두르고 불을 끕니다. 간은 한 번에 많이 하지 말고 조금씩 맛을 보며 맞추세요.</textarea>
    <label for="gap">문장 사이 쉼</label>
    <select id="gap">
      <option value="0">없음</option>
      <option value="0.1">조금 (0.1초)</option>
      <option value="0.2">보통 (0.2초)</option>
      <option value="0.35">길게 (0.35초)</option>
      <option value="0.5">아주 길게 (0.5초)</option>
    </select>
    <div class="row">
      <button class="main" id="fast">🔊 이어서 듣기 (새 방식)</button>
      <button class="sub" id="whole">전체 한 번에 듣기 (예전 방식)</button>
      <button class="stop" id="stop">■ 정지</button>
    </div>
    <div class="result" id="out">버튼을 눌러 시작하세요.</div>
    <div class="kara" id="kara"></div>
    <details class="diag"><summary>진단 기록 (하이라이트가 안 될 때 이 화면을 캡처해 보내 주세요)</summary><pre id="dbg"></pre></details>
  </section>

  <small>이 파일은 index.html과 별개의 시험용입니다. 같은 사이트에 올리면 위에서 저장한 Key와 Region을 기존 앱과 함께 씁니다.</small>
</main>

<script>
const $=id=>document.getElementById(id);
const PAGE_VER='v6';

/* 진단 기록: 화면 맨 아래 「진단 기록」에 표시 */
const dbgLines=[];
function dbg(m){
  const t=(performance.now()/1000).toFixed(2);
  dbgLines.push('['+t+'] '+m); if(dbgLines.length>60)dbgLines.shift();
  const el=$('dbg'); if(el)el.textContent=dbgLines.join('\n');
}
window.addEventListener('error',e=>dbg('오류: '+(e.message||e)));
window.addEventListener('unhandledrejection',e=>dbg('오류: '+((e.reason&&e.reason.message)||e.reason)));

/* 예전 index.html이 등록해 둔 서비스워커가 이 페이지의 옛 복사본을 돌려주는 일을 막는다 */
(async function(){
  try{
    const KEY='tts_clean_'+PAGE_VER;
    if(localStorage.getItem(KEY)==='1'){dbg('캐시 정리 이미 완료');return}
    let n=0;
    if(navigator.serviceWorker){
      const regs=await navigator.serviceWorker.getRegistrations();
      n=regs.length; await Promise.all(regs.map(r=>r.unregister()));
    }
    if(window.caches){const ks=await caches.keys(); await Promise.all(ks.map(k=>caches.delete(k)))}
    localStorage.setItem(KEY,'1');
    dbg('캐시 정리: 서비스워커 '+n+'개 제거');
    if(n>0)location.reload();
  }catch(e){dbg('캐시 정리 실패: '+e.message)}
})();
dbg('페이지 '+PAGE_VER+' 시작');
dbg('브라우저: '+navigator.userAgent.replace(/^Mozilla\/5\.0 /,'').slice(0,90));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const VOICE='ko-KR-SunHiNeural';
const store={
  get:k=>{try{return localStorage.getItem(k)||''}catch(e){return ''}},
  set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}
};
$('gap').value=store.get('mijin_tts_gap')||'0.2';
$('gap').onchange=()=>store.set('mijin_tts_gap',$('gap').value);
$('key').value=store.get('mijin_azure_key');
$('region').value=store.get('mijin_azure_region')||'koreacentral';

$('save').onclick=()=>{
  const k=$('key').value.trim(), r=$('region').value.trim()||'koreacentral';
  if(k)store.set('mijin_azure_key',k);
  store.set('mijin_azure_region',r);
  const m=$('saveMsg'); m.hidden=false;
  m.className='result'+(k?'':' err');
  m.textContent=k?'이 휴대폰에 저장했습니다.':'Key를 입력해 주세요.';
};

const xmlEsc=s=>String(s).replace(/[<>&'"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;',"'":'&apos;','"':'&quot;'}[c]));

/* 문장 단위로 자르기 */
function splitText(t){
  t=t.replace(/\r/g,'').replace(/[ \t]+/g,' ').trim();
  const raw=t.split(/(?<=[.!?…。])\s+|\n+/).map(s=>s.trim()).filter(Boolean);
  const out=[];
  for(const s of raw){
    if(s.length<=90){out.push(s);continue}
    let cur='';
    for(const p of s.split(/(?<=[,，;])\s*/)){
      if(cur&&(cur+p).length>90){out.push(cur.trim());cur=p+' '}else cur+=p+' ';
    }
    if(cur.trim())out.push(cur.trim());
  }
  const merged=[];
  for(const s of out){
    const last=merged.length-1;
    if(last>=0&&s.length<12&&(merged[last]+' '+s).length<90)merged[last]+=' '+s;
    else merged.push(s);
  }
  return merged;
}

function settings(){
  const key=store.get('mijin_azure_key'), region=store.get('mijin_azure_region')||'koreacentral';
  if(!key)throw new Error('먼저 위에서 Azure Speech Key를 저장해 주세요.');
  return {key,region};
}

/* 마침표 보정 (음성 전용): 마침표가 없으면 Azure가 쉬지 않고 붙여 읽음 — server.py의 ensure_tts_periods와 같은 방식 */
function ensurePeriod(t){
  t=t.trim(); if(!t)return t;
  const core=t.replace(/["'”’」』)\]》〉]+$/,'');
  if(core&&!/[.?!…。！？,:;]$/.test(core))return core+'.'+t.slice(core.length);
  return t;
}

/* Azure에서 음성(mp3) 받기 → ArrayBuffer
   server.py에서 가져온 핵심: Azure가 문장 앞뒤에 기본으로 넣는 무음을 mstts:silence로 0ms로 고정 */
function buildSsml(text,withSil){
  const head=`<speak version="1.0" xmlns="http://www.w3.org/2001/10/synthesis" xmlns:mstts="http://www.w3.org/2001/mstts" xml:lang="ko-KR"><voice name="${VOICE}">`;
  const sil=withSil?`<mstts:silence type="Leading-exact" value="0ms"/><mstts:silence type="Tailing-exact" value="0ms"/><mstts:silence type="Sentenceboundary-exact" value="0ms"/>`:'';
  return head+sil+`<prosody rate="-3%">${xmlEsc(ensurePeriod(text))}</prosody></voice></speak>`;
}
async function synth(text,signal,tries=0,withSil=true){
  const {key,region}=settings();
  let res;
  try{
    res=await fetch(`https://${region}.tts.speech.microsoft.com/cognitiveservices/v1`,{
      method:'POST',signal,
      headers:{
        'Ocp-Apim-Subscription-Key':key,
        'Content-Type':'application/ssml+xml',
        'X-Microsoft-OutputFormat':'audio-24khz-48kbitrate-mono-mp3'
      },
      body:buildSsml(text,withSil)
    });
  }catch(e){
    if(e.name==='AbortError')throw e;
    throw new Error('Azure에 연결하지 못했습니다. 인터넷과 Region 이름을 확인해 주세요.');
  }
  if(res.status===401||res.status===403)throw new Error('Key 또는 Region이 맞지 않습니다. (오류 '+res.status+')');
  if(res.status===429){
    if(tries<2){await sleep(1200);return synth(text,signal,tries+1,withSil)}
    throw new Error('요청이 너무 많습니다. 잠시 뒤 다시 눌러 주세요.');
  }
  if(res.status===400&&withSil)return synth(text,signal,tries,false);   /* 무음 태그가 원인일 수 있어 태그 없이 재시도 */
  if(!res.ok)throw new Error('Azure 음성 오류 ('+res.status+')');
  return res.arrayBuffer();
}

/* ===== 읽는 문장 하이라이트 ===== */
function buildKara(chunks){
  const k=$('kara'); k.innerHTML=''; k.scrollTop=0;
  chunks.forEach((c,i)=>{
    const sp=document.createElement('span'); sp.textContent=c; sp.dataset.i=i;
    k.appendChild(sp); k.appendChild(document.createTextNode(' '));
  });
}
function markKara(now){
  const k=$('kara');
  k.querySelectorAll('span').forEach(sp=>{
    const i=+sp.dataset.i;
    const isNow=(i===now), isDone=(now<0||i<now);
    sp.className=isDone?'done':(isNow?'now':'');
    /* CSS가 적용되지 않아도 보이도록 색을 직접 지정 */
    sp.style.background=isNow?'#ffe27a':'';
    sp.style.color=isDone?'#8a9797':'';
    sp.style.fontWeight=isNow?'700':'';
    if(isNow){
      try{k.scrollTo({top:Math.max(0,sp.offsetTop-k.clientHeight/2+sp.offsetHeight/2),behavior:'smooth'})}
      catch(e){try{k.scrollTop=Math.max(0,sp.offsetTop-k.clientHeight/2)}catch(_){}}
    }
  });
}
buildKara(splitText($('text').value));
$('text').addEventListener('input',()=>buildKara(splitText($('text').value)));

function show(html,isErr){const o=$('out');o.className='result'+(isErr?' err':'');o.innerHTML=html}

/* ===== 재생: Web Audio로 문장들을 빈틈없이 이어 붙임 ===== */
let ctx=null, run=0, ctrl=null, sources=[], raf=0, pendingRes=null, timers=[];
const player=new Audio();   /* 예전 방식 비교용 */

/* 재생기는 매번 새로 만든다: 폰에서는 한 번 쓴 재생기가 멈추거나 시계가 어긋나는 일이 있어 두 번째부터 하이라이트가 안 따라오던 원인 후보 */
async function freshCtx(){
  const AC=window.AudioContext||window.webkitAudioContext;
  const old=ctx;
  ctx=new AC();                                   /* 버튼을 누른 순간에 만들어야 폰이 소리를 허용함 */
  if(old){try{old.close().catch(()=>{})}catch(e){}}
  try{await Promise.race([ctx.resume(),sleep(1500)])}catch(e){}
  return ctx;
}
function unlockPlayer(){
  const b=new ArrayBuffer(46),v=new DataView(b);
  const w=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));
  w(0,'RIFF');v.setUint32(4,38,true);w(8,'WAVE');w(12,'fmt ');
  v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,8000,true);v.setUint32(28,8000,true);v.setUint16(32,1,true);v.setUint16(34,8,true);
  w(36,'data');v.setUint32(40,2,true);v.setUint8(44,128);v.setUint8(45,128);
  player.src=URL.createObjectURL(new Blob([b],{type:'audio/wav'}));
  player.play().catch(()=>{});
}

/* 문장 앞뒤의 무음을 잘라내어 문장 사이 틈을 줄임 */
function trimRange(buf){
  const d=buf.getChannelData(0), sr=buf.sampleRate, th=0.012;
  let a=0,b=d.length-1;
  while(a<b&&Math.abs(d[a])<th)a++;
  while(b>a&&Math.abs(d[b])<th)b--;
  const off=Math.max(0,a/sr-0.02), end=Math.min(buf.duration,b/sr+0.06);
  return {off,dur:Math.max(0.05,end-off)};
}

function stopAll(){
  run++;
  if(ctrl){ctrl.abort();ctrl=null}
  cancelAnimationFrame(raf);
  timers.forEach(clearTimeout);timers=[];
  sources.forEach(s=>{try{s.stop()}catch(e){}});sources=[];
  player.onended=null;player.onerror=null;
  try{player.pause()}catch(e){}
  if(pendingRes){const r=pendingRes;pendingRes=null;r()}
}

async function speakFast(){
  stopAll();
  const my=++run; ctrl=new AbortController(); const sig=ctrl.signal;
  const t0=performance.now();
  const gap=Math.max(0,parseFloat($('gap').value)||0);
  const ac=await freshCtx();
  if(my!==run)return;
  dbg('재생기 '+ac.state+' · 쉼 '+gap+'초');
  let chunks;
  try{settings();chunks=splitText($('text').value)}catch(e){show(e.message,true);return}
  if(!chunks.length){show('읽을 글을 입력해 주세요.',true);return}
  buildKara(chunks);
  dbg('시작 · 문장 '+chunks.length+'개');
  try{$('kara').scrollIntoView({block:'center',behavior:'smooth'})}catch(e){}
  show('첫 문장을 준비하는 중...');

  const jobs=[];
  const start=i=>{if(i<chunks.length&&!jobs[i]){jobs[i]=synth(chunks[i],sig);jobs[i].catch(()=>{})}};
  const starts=[]; let nextTime=0, late=0, first='', lastMarked=-2;

  /* 하이라이트: 재생 시계(tick)와 예약 타이머 두 가지로 표시 — 어느 한쪽이 멈춰도 따라감 */
  const mark=(idx,src)=>{
    if(my!==run||idx<=lastMarked)return;
    if(lastMarked===-2)first=((performance.now()-t0)/1000).toFixed(1);
    lastMarked=idx;
    try{markKara(idx)}catch(e){dbg('하이라이트 오류: '+e.message)}
    dbg('표시 '+(idx+1)+'번 문장 ('+src+')');
    show(`<b>첫 소리까지 ${first}초</b><br>▶ ${idx+1} / ${chunks.length} 문장 재생 중<br><small>재생기: ${ac.state} · 예약 ${starts.length}/${chunks.length}</small>`);
  };
  const tick=()=>{
    if(my!==run)return;
    const now=ac.currentTime; let idx=-1;
    for(let j=0;j<starts.length;j++)if(now>=starts[j])idx=j;
    if(idx>=0)mark(idx,'시계');
    raf=requestAnimationFrame(tick);
  };
  raf=requestAnimationFrame(tick);

  for(let i=0;i<chunks.length;i++){
    start(i);start(i+1);
    let ab;
    try{ab=await jobs[i]}catch(e){
      if(my!==run)return;
      show(e.message,true);stopAll();return;
    }
    if(my!==run)return;
    let buf;
    try{buf=await ac.decodeAudioData(ab)}catch(e){
      if(my!==run)return;
      show('음성을 해석하지 못했습니다. 다시 눌러 주세요.',true);stopAll();return;
    }
    if(my!==run)return;
    const {off,dur}=trimRange(buf);
    const src=ac.createBufferSource(); src.buffer=buf; src.connect(ac.destination);
    let when;
    if(i===0)when=ac.currentTime+0.03;
    else if(nextTime<ac.currentTime+0.01){late++;when=ac.currentTime+0.01}   /* 다음 문장이 늦게 와서 끊긴 경우 */
    else when=nextTime;
    src.start(when,off,dur);
    sources.push(src);starts.push(when);
    dbg('예약 '+(i+1)+'/'+chunks.length+' 시작 '+when.toFixed(2)+' 길이 '+dur.toFixed(2)+(i>0&&late?' (늦음 '+late+')':''));
    timers.push(setTimeout(()=>mark(i,'타이머'),Math.max(0,(when-ac.currentTime)*1000)));
    nextTime=when+dur+gap;
    /* 너무 앞서 받지 않도록 조절 (요금·요청 수 제한 보호) */
    while(my===run&&nextTime-ac.currentTime>10)await sleep(250);
  }
  while(my===run&&ac.currentTime<nextTime)await sleep(100);
  if(my!==run)return;
  cancelAnimationFrame(raf);
  markKara(-1);
  show(`<b>첫 소리까지 ${first||'-'}초</b><br>✓ ${chunks.length}문장 · 끊김 ${late}회`);
}

/* 예전 방식: 전체를 한 번에 받아서 재생 (비교용) */
async function speakWhole(){
  stopAll(); unlockPlayer();
  const my=++run; ctrl=new AbortController();
  const t0=performance.now();
  let text;
  try{settings();text=$('text').value.trim()}catch(e){show(e.message,true);return}
  if(!text){show('읽을 글을 입력해 주세요.',true);return}
  buildKara(splitText(text));
  show('전체 음성을 만드는 중... (예전 방식)');
  let ab;
  try{ab=await synth(text,ctrl.signal)}catch(e){
    if(my!==run)return;
    show(e.message,true);return;
  }
  if(my!==run)return;
  const url=URL.createObjectURL(new Blob([ab],{type:'audio/mpeg'}));
  await new Promise(res=>{
    pendingRes=res;
    player.onended=()=>res(); player.onerror=()=>res();
    player.src=url;
    player.play().then(()=>{
      const s=((performance.now()-t0)/1000).toFixed(1);
      if(my===run)show(`<b>예전 방식: 첫 소리까지 ${s}초</b><br>▶ 재생 중`);
    }).catch(()=>res());
  });
  URL.revokeObjectURL(url);
}

$('fast').onclick=speakFast;
$('whole').onclick=speakWhole;
$('stop').onclick=()=>{stopAll();show('멈췄습니다.')};
</script>
